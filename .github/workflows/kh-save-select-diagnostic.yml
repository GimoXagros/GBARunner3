name: Build KH runtime-state investigation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/kh-save-select-black-screen

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    strategy:
      fail-fast: false
      matrix:
        variant: [K-baseline, L-aligned-stack]
    name: ${{ matrix.variant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ matrix.variant == 'K-baseline' && '58240561b413e6078d3bab6a204f7ff364d283be' || github.sha }}
      - name: Build diagnostic NDS
        shell: bash
        run: >-
          make -C code
          GBAR3_RUNTIME_DIAGNOSTICS=1
      - name: Test diagnostic decoder
        shell: bash
        run: |
          python3 tools/diagnostics/test_decode_g3diag.py
          python3 tools/diagnostics/test_decode_g3cf.py
          python3 tools/diagnostics/test_hicode_undefined_dispatch.py
          if [ -f tools/diagnostics/test_diagnostic_stack.py ]; then
            python3 tools/diagnostics/test_diagnostic_stack.py
          fi
      - name: Prepare hardware-test artifact
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.variant }}/_gba" "out/${{ matrix.variant }}/symbols"
          cp code/bootstrap/GBARunner3.nds "out/${{ matrix.variant }}/GBARunner3-KH-${{ matrix.variant }}.nds"
          cp -r configs "out/${{ matrix.variant }}/_gba/"
          cp docs/kh-save-select-runtime-state-test.md "out/${{ matrix.variant }}/HARDWARE-TEST.md"
          cp tools/diagnostics/decode_g3diag.py "out/${{ matrix.variant }}/decode_g3diag.py"
          cp code/core/arm9/arm9.elf "out/${{ matrix.variant }}/symbols/"
          arm-none-eabi-nm -n -C code/core/arm9/arm9.elf > "out/${{ matrix.variant }}/symbols/arm9-nm.txt"
          arm-none-eabi-objdump -d code/core/arm9/arm9.elf > "out/${{ matrix.variant }}/symbols/arm9-disassembly.txt"
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > "out/${{ matrix.variant }}/SOURCE.txt"
          sha256sum code/bootstrap/GBARunner3.nds > "out/${{ matrix.variant }}/SHA256.txt"
      - name: Publish diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBARunner3-KH-${{ matrix.variant }}
          path: out/${{ matrix.variant }}
