name: Build KH control-flow diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - fix/kh-save-select-black-screen

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: G-control-flow-pretrigger
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build diagnostic NDS
        shell: bash
        run: >-
          make -C code
          GBAR3_CONTROL_FLOW_DIAGNOSTICS=1
      - name: Test diagnostic decoder
        shell: bash
        run: python3 tools/diagnostics/test_decode_g3cf.py
      - name: Prepare hardware-test artifact
        shell: bash
        run: |
          mkdir -p "out/G-control-flow-pretrigger/_gba"
          cp code/bootstrap/GBARunner3.nds "out/G-control-flow-pretrigger/GBARunner3-KH-G-control-flow-pretrigger.nds"
          cp -r configs "out/G-control-flow-pretrigger/_gba/"
          cp docs/kh-save-select-control-flow-test.md "out/G-control-flow-pretrigger/HARDWARE-TEST.md"
          cp tools/diagnostics/decode_g3cf.py "out/G-control-flow-pretrigger/decode_g3cf.py"
      - name: Publish diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBARunner3-KH-G-control-flow-pretrigger
          path: out/G-control-flow-pretrigger
