name: Build KH I hicode Thumb dispatch test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/kh-save-select-black-screen

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: I-hicode-thumb-dispatch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build diagnostic NDS
        shell: bash
        run: >-
          make -C code
          GBAR3_CONTROL_FLOW_DIAGNOSTICS=1
      - name: Test diagnostic decoder
        shell: bash
        run: |
          python3 tools/diagnostics/test_decode_g3cf.py
          python3 tools/diagnostics/test_hicode_undefined_dispatch.py
      - name: Prepare hardware-test artifact
        shell: bash
        run: |
          mkdir -p "out/I-hicode-thumb-dispatch/_gba"
          cp code/bootstrap/GBARunner3.nds "out/I-hicode-thumb-dispatch/GBARunner3-KH-I-hicode-thumb-dispatch.nds"
          cp -r configs "out/I-hicode-thumb-dispatch/_gba/"
          cp docs/kh-save-select-hicode-thumb-test.md "out/I-hicode-thumb-dispatch/HARDWARE-TEST.md"
          cp tools/diagnostics/decode_g3cf.py "out/I-hicode-thumb-dispatch/decode_g3cf.py"
      - name: Publish diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBARunner3-KH-I-hicode-thumb-dispatch
          path: out/I-hicode-thumb-dispatch
