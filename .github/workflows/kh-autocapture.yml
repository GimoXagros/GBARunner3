name: Build M automatic hardware diagnostics
on:
  workflow_dispatch:
  push:
    branches: [fix/kh-hardware-divergence-autocapture]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify format generation
        run: python3 tools/diagnostics/generate_autocapture_format.py --check
      - name: Build M application and test NDS
        run: make -C code debug GBAR3_RUNTIME_DIAGNOSTICS=1 GBAR3_DIAG_AUTOCAPTURE=1 GBAR3_BUILD_ID=${{ github.sha }}
      - name: Preserve internal build for semantic and lab gates
        run: |
          mkdir -p out/symbols out/tests
          cp code/bootstrap/GBARunner3.nds out/M.nds
          cp code/core/arm9/arm9.elf out/symbols/arm9.elf
          cp code/test/test.nds out/tests/test.nds
          "$DEVKITARM/bin/arm-none-eabi-objdump" -d code/core/arm9/arm9.elf > out/symbols/arm9-disassembly.txt
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version > out/toolchain.txt
          printf '%s\n' '${{ github.sha }}' > out/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M-internal-build
          path: out
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: M-internal-build
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install unicorn==2.1.4 pyelftools==0.32 capstone==5.0.7
      - name: Format and existing diagnostic regressions
        run: |
          python tools/diagnostics/generate_autocapture_format.py --check
          python -m unittest discover -s tools/diagnostics -p 'test_*.py'
          python tools/diagnostics/test_decode_g3diag.py
          python tools/diagnostics/test_decode_g3cf.py
          python tools/diagnostics/test_hicode_undefined_dispatch.py
      - name: Execute linked M diagnostics and saved-SPSR dispatch
        run: |
          python tools/diagnostics/test_autocapture_elf.py out/symbols/arm9.elf --output out/M-semantic-tests.json
          python tools/diagnostics/test_hicode_dispatch_elf.py out/symbols/arm9.elf --output out/hicode-semantic-tests.json
      - uses: actions/upload-artifact@v4
        with:
          name: M-semantic-test-results
          path: out/*tests.json
