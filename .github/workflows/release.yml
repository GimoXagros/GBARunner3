name: Build release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Make application and test ROM
        run: |
          make -C code debug
      - name: Prepare for build publishing
        run: |
          mkdir -p out/_gba/
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
      - name: Add opt-in boot settings probe to the RC2 investigation package
        if: github.ref == 'refs/tags/custom-v0.1.3-rc2'
        run: |
          make -C code clean
          make -C code GBAR3_DISPLAY_FLICKER_DIAGNOSTICS=1 debug
          cp code/bootstrap/GBARunner3.nds out/GBARunner3-settings-diagnostic.nds
          cp docs/v013rc2-flicker-investigation.md out/READ-ME-RC2.md
          cp docs/v013rc2-hardware-runs.csv out/hardware-runs.csv
          cp -r docs/v013rc2-evidence out/v013rc2-evidence
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7
        with:
          path: out
          name: GBARunner3
      - name: Package for release
        run: |
          cd out && zip -r ../GBARunner3.zip *
      - name: Upload to the published release
        uses: actions/github-script@v9
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            const upload = require('./.github/scripts/upload-release.cjs');
            await upload({github, context});
