name: Build release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Make application and test ROM
        run: |
          make -C code debug
      - name: Prepare for build publishing
        run: |
          mkdir -p out/_gba/
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
      - name: Verify and document the v0.1.3 stable package
        if: github.ref == 'refs/tags/custom-v0.1.3'
        run: |
          echo '9968bb423430b2fcfc6aacec70a5c2e5603f711952c6eb2d6c57fbfac287a3b2  out/GBARunner3.nds' | sha256sum -c -
          cp docs/v013-release.md out/README-v0.1.3.md
          cd out
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7
        with:
          path: out
          name: GBARunner3
      - name: Package for release
        run: |
          cd out && zip -r ../GBARunner3.zip *
      - name: Upload to the published release
        uses: actions/github-script@v9
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            const upload = require('./.github/scripts/upload-release.cjs');
            await upload({github, context});
