name: Build release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Make application and test ROM
        run: |
          make -C code debug
      - name: Prepare for build publishing
        if: github.ref != 'refs/tags/custom-v0.1.3-rc3' && github.ref != 'refs/tags/custom-v0.1.4' && github.ref != 'refs/tags/custom-v0.1.5'
        run: |
          mkdir -p out/_gba/
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
      - name: Verify and document the v0.1.3 stable package
        if: github.ref == 'refs/tags/custom-v0.1.3'
        run: |
          echo '9968bb423430b2fcfc6aacec70a5c2e5603f711952c6eb2d6c57fbfac287a3b2  out/GBARunner3.nds' | sha256sum -c -
          cp docs/v013-release.md out/README-v0.1.3.md
          cd out
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Verify and package the RC3 validation candidate
        if: github.ref == 'refs/tags/custom-v0.1.3-rc3'
        env:
          RC3_RELEASE_TAG: ${{ github.event.release.tag_name }}
          RC3_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RC3_RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/scripts/package-rc3.py --mode published --out out --zip GBARunner3.zip
      - name: Verify and package v0.1.4 stable
        if: github.ref == 'refs/tags/custom-v0.1.4'
        env:
          V014_RELEASE_TAG: ${{ github.event.release.tag_name }}
          V014_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          V014_RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/scripts/package-v014.py --mode published --out out --zip GBARunner3.zip
      - name: Verify and package v0.1.5 stable
        if: github.ref == 'refs/tags/custom-v0.1.5'
        env:
          V015_RELEASE_TAG: ${{ github.event.release.tag_name }}
          V015_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          V015_RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/scripts/package-v015.py --mode published --out out --zip GBARunner3.zip
      - name: Verify v0.1.6 binary and include RTC upgrade instructions
        if: github.ref == 'refs/tags/custom-v0.1.6'
        run: |
          echo '8cca060c40205e149c511b001d810e942249964a1b5921b15ea19723ee34c965  out/GBARunner3.nds' | sha256sum -c -
          python3 tools/validate_nds_banner.py out/GBARunner3.nds
          mkdir -p out/tools
          cp tools/rtc_migrate.py out/tools/
          cp docs/releases/custom-v0.1.6.md out/README-v0.1.6.md
          cp docs/releases/RTC-v0.1.5.md out/RTC-LEGACY-UPGRADE.md
          cd out
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../v016-sums
          mv ../v016-sums SHA256SUMS
      - name: Verify v0.1.7 binary and include RTC upgrade instructions
        if: github.ref == 'refs/tags/custom-v0.1.7'
        run: |
          echo '6670db8c8fc1abbde35ab14a91055d43df7a3c26303868cbdeefc8b07ef50cfb  out/GBARunner3.nds' | sha256sum -c -
          python3 tools/validate_nds_banner.py out/GBARunner3.nds
          mkdir -p out/tools
          cp tools/rtc_migrate.py out/tools/
          cp docs/releases/custom-v0.1.7.md out/README-v0.1.7.md
          cp docs/releases/RTC-v0.1.5.md out/RTC-LEGACY-UPGRADE.md
          cd out
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../v017-sums
          mv ../v017-sums SHA256SUMS
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7
        with:
          path: out
          name: GBARunner3
      - name: Package for release
        if: github.ref != 'refs/tags/custom-v0.1.3-rc3' && github.ref != 'refs/tags/custom-v0.1.4' && github.ref != 'refs/tags/custom-v0.1.5'
        run: |
          cd out && zip -r ../GBARunner3.zip *
      - name: Upload to the published release
        uses: actions/github-script@v9
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            const upload = require('./.github/scripts/upload-release.cjs');
            await upload({github, context});
      - name: Publish the stable updater download
        if: github.event.release.prerelease == false
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs/promises');
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id: context.payload.release.id,
              name: 'GBARunner3-Custom.zip',
              data: await fs.readFile('GBARunner3.zip'),
            });
