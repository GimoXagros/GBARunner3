name: Build nightly

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Make application and test ROM
        run: |
          make -C code debug CC="$DEVKITARM/bin/arm-none-eabi-gcc -fstack-usage" CXX="$DEVKITARM/bin/arm-none-eabi-g++ -fstack-usage"
          "$DEVKITARM/bin/arm-none-eabi-g++" -std=c++17 -O2 -marm -march=armv5te -nostdlib -fno-builtin -fno-exceptions -fno-unwind-tables -Wl,-e,search_probe,-Ttext=0x02000000 -Icode/core/arm9/source tools/tests/save_search_probe.cpp code/core/arm9/source/MemFastSearch.s -o /tmp/save-search.elf
          "$DEVKITARM/bin/arm-none-eabi-g++" -std=c++17 -O2 -marm -march=armv5te -nostdlib -Wl,-e,hex_parse,-Ttext=0x02000000 -Icode/core/arm9/source tools/tests/hex_address_probe.cpp -o /tmp/hex-address.elf
      - name: Prepare for build publishing
        run: |
          mkdir -p out/_gba/
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
          mkdir -p out/tests
          cp code/test/test.nds out/tests/
          cp code/core/arm9/arm9.elf out/tests/
          cp code/core/arm7/GBARunner3.elf out/tests/arm7.elf
          cp /tmp/hex-address.elf out/tests/
          cp /tmp/save-search.elf out/tests/
          mkdir -p out/tests/stack-usage
          find code/core -name '*.su' -exec cp --parents {} out/tests/stack-usage/ \;
          mkdir -p out/tests/link-layout
          find code/core -name '*.map' -exec cp --parents {} out/tests/link-layout/ \;
      - name: Preserve linker diagnostics on a failed build
        if: failure()
        run: |
          mkdir -p link-diagnostics
          find code/core/arm9 -name '*.map' -exec cp {} link-diagnostics/ \;
          "$DEVKITARM/bin/arm-none-eabi-size" -A code/core/arm9/build/Save*.o > link-diagnostics/save-object-sections.txt || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failed-link-diagnostics
          path: link-diagnostics
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7
        with:
          path: out
          name: GBARunner3

  save-io-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify save initialization and terminal error paths
        run: SANITIZE=1 python3 tools/tests/test_save_io_host.py --require-fixed --output save-io-results.json
      - name: Verify production save I/O through actual FatFs and ARM7 drivers
        run: SANITIZE=1 python3 tools/tests/test_save_fatfs_host.py
      - uses: actions/upload-artifact@v7
        with:
          name: save-io-results
          path: save-io-results.json

  hicode-dispatch-semantics:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Execute host serializer regressions with sanitizers
        run: SANITIZE=1 python3 tools/tests/test_json_settings_host.py
      - name: Verify production RTC BCD and calendar conversions
        run: SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/tests/test_rtc_calendar_host.py --output rtc-calendar-results.json
      - name: Verify independent legacy fixtures and explicit offline adoption
        run: |
          python3 tools/tests/test_rtc_legacy_fixtures.py
          python3 tools/tests/test_rtc_migrate.py
      - name: Verify production RTC persistence and restart
        run: |
          SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/tests/test_rtc_v2_host.py
          for control in legacy-auto-load legacy-overwrite backup-delete direct-old-delta version-bypass identity-bypass uncleared-dirty repeat-migration prospective-select-bypass missing-directory-guard; do
            SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/tests/test_rtc_v2_host.py --negative-control "$control"
          done
          for control in prospective-select-bypass missing-directory-guard; do
            SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/tests/test_rtc_v2_host.py --baseline-ref de6982341bdf24b5ec4817a503332d0b9422c3bd --baseline-control "$control"
          done
      - name: Verify RTC GPIO and recovery selection with synthetic files
        run: |
          SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/tests/test_rtc_recovery_host.py
          SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/tests/test_rtc_recovery_host.py --negative-control no-dirty
          SANITIZE=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/tests/test_rtc_recovery_host.py --negative-control partial-offset
      - uses: actions/upload-artifact@v7
        with:
          name: rtc-calendar-results
          path: rtc-calendar-results.json
      - name: Verify production storage transaction failures with sanitizers
        run: SANITIZE=1 python3 tools/tests/test_storage_failure_host.py --require-fixed --output storage-results.json
      - name: Verify actual FatFs receives driver errors
        run: SANITIZE=1 python3 tools/tests/test_storage_fatfs_host.py
      - name: Verify all save-signature block offsets
        run: SANITIZE=1 python3 tools/tests/test_save_search_host.py
      - uses: actions/upload-artifact@v7
        with:
          name: storage-transaction-results
          path: storage-results.json
      - name: Test release upload without network mutations
        run: node tools/tests/test_release_upload.cjs
      - name: Test stable package guards
        run: |
          python3 tools/tests/test_v014_package.py
          python3 tools/tests/test_v015_package.py
      - name: Execute EEPROM source-selection audit
        run: SANITIZE=1 python3 tools/tests/test_eeprom_source_host.py
      - name: Validate packaged configs and repository invariants
        run: python3 tools/tests/test_repository_invariants.py
      - uses: actions/download-artifact@v8
        with:
          name: GBARunner3
          path: out
      - name: Install instruction-test dependencies
        run: python3 -m pip install unicorn==2.1.4 pyelftools==0.32
      - name: Execute linked ARM parser
        run: python3 tools/tests/test_hex_address_arm.py out/tests/hex-address.elf
      - name: Execute linked production RTC adoption and restart
        run: python3 tools/tests/test_rtc_loader_elf.py out/tests/arm9.elf
      - name: Verify RTC boot with ARM946 L4 interworking rules
        run: python3 tools/tests/test_rtc_boot_l4_elf.py out/tests/arm9.elf
      - name: Execute linked ARM save-signature corpus
        run: python3 tools/tests/test_save_search_arm.py out/tests/save-search.elf
      - name: Execute linked ARM7 and ARM9 storage transport
        run: python3 tools/tests/test_storage_linked_arm.py out/tests/arm9.elf out/tests/arm7.elf --output storage-linked-results.json
      - name: Execute linked save latches and guest SRAM writes after error
        run: python3 tools/tests/test_save_io_elf.py out/tests/arm9.elf --arm7 out/tests/arm7.elf --output save-io-linked-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: save-io-linked-results
          path: save-io-linked-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: storage-linked-results
          path: storage-linked-results.json
      - name: Verify linked IRQ callbacks and ELF audit negative control
        run: |
          python3 tools/tests/test_irq_callbacks_elf.py out/tests/arm9.elf --output irq-results.json
          python3 tools/tests/test_display_audit.py out/tests/arm9.elf
      - uses: actions/upload-artifact@v7
        with:
          name: irq-callback-results
          path: irq-results.json
      - name: Execute linked JIT metadata and address regressions
        run: python3 tools/tests/test_jit_core_elf.py out/tests/arm9.elf --output jit-results.json
      - name: Execute linked noncontiguous ROM DMA boundary cases
        run: python3 tools/tests/test_dma_rom_elf.py out/tests/arm9.elf --output dma-rom-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: dma-rom-results
          path: dma-rom-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: jit-core-results
          path: jit-results.json
      - name: Execute linked ARM dispatch and negative controls
        run: python3 tools/tests/test_hicode_dispatch_elf.py out/tests/arm9.elf --output dispatch-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: hicode-dispatch-results
          path: dispatch-results.json
