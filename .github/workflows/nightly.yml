name: Build nightly

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Make application and test ROM
        run: |
          make -C code debug
      - name: Prepare for build publishing
        run: |
          mkdir -p out/_gba/
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
          mkdir -p out/tests
          cp code/test/test.nds out/tests/
          cp code/core/arm9/arm9.elf out/tests/
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: out
          name: GBARunner3

  hicode-dispatch-semantics:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaged configs and repository invariants
        run: python3 tools/tests/test_repository_invariants.py
      - uses: actions/download-artifact@v4
        with:
          name: GBARunner3
          path: out
      - name: Install instruction-test dependencies
        run: python3 -m pip install unicorn==2.1.4 pyelftools==0.32
      - name: Execute linked ARM dispatch and negative controls
        run: python3 tools/tests/test_hicode_dispatch_elf.py out/tests/arm9.elf --output dispatch-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: hicode-dispatch-results
          path: dispatch-results.json
