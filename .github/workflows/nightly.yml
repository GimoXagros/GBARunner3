name: Build nightly

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Make application and test ROM
        run: |
          make -C code debug
          "$DEVKITARM/bin/arm-none-eabi-g++" -std=c++17 -O2 -marm -march=armv5te -nostdlib -Wl,-e,hex_parse,-Ttext=0x02000000 -Icode/core/arm9/source tools/tests/hex_address_probe.cpp -o /tmp/hex-address.elf
      - name: Prepare for build publishing
        run: |
          mkdir -p out/_gba/
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
          mkdir -p out/tests
          cp code/test/test.nds out/tests/
          cp code/core/arm9/arm9.elf out/tests/
          cp /tmp/hex-address.elf out/tests/
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7
        with:
          path: out
          name: GBARunner3

  hicode-dispatch-semantics:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Execute host serializer regressions with sanitizers
        run: SANITIZE=1 python3 tools/tests/test_json_settings_host.py
      - name: Test release upload without network mutations
        run: node tools/tests/test_release_upload.cjs
      - name: Execute EEPROM source-selection audit
        run: SANITIZE=1 python3 tools/tests/test_eeprom_source_host.py
      - name: Report save I/O invariants and known failures
        run: SANITIZE=1 python3 tools/tests/test_save_io_host.py --output save-io-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: save-io-results
          path: save-io-results.json
      - name: Validate packaged configs and repository invariants
        run: python3 tools/tests/test_repository_invariants.py
      - uses: actions/download-artifact@v8
        with:
          name: GBARunner3
          path: out
      - name: Install instruction-test dependencies
        run: python3 -m pip install unicorn==2.1.4 pyelftools==0.32
      - name: Execute linked ARM parser
        run: python3 tools/tests/test_hex_address_arm.py out/tests/hex-address.elf
      - name: Execute linked JIT metadata and address regressions
        run: python3 tools/tests/test_jit_core_elf.py out/tests/arm9.elf --output jit-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: jit-core-results
          path: jit-results.json
      - name: Execute linked ARM dispatch and negative controls
        run: python3 tools/tests/test_hicode_dispatch_elf.py out/tests/arm9.elf --output dispatch-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: hicode-dispatch-results
          path: dispatch-results.json
